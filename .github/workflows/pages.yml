name: Pages Deploy
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: ci
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Apply
        env:
          A54792: ${{ secrets.A54792 }}
          BBD1EB: ${{ secrets.BBD1EB }}
        run: |
          python3 -c "
          import os, pathlib, sys
          k1 = os.environ.get('A54792', '')
          k2 = os.environ.get('BBD1EB', '')
          idx = pathlib.Path('index.html')
          txt = idx.read_text(encoding='utf-8')
          out = txt.replace('<!-- bde88b4b6e178c86669a3c70d541696be6717a71b5 -->', k1) if k1 else txt
          out = out.replace('<!-- 060378e13955fcdfadee499ea82951aae879db4b5376 -->', k2) if k2 else out
          if out == txt and (k1 or k2):
              sys.exit(1)
          if out != txt:
              idx.write_text(out, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
